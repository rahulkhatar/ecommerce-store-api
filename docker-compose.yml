services:
  # ============================================
  # MSSQL Server Database
  # ============================================
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce-mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: Reset@789
      MSSQL_PID: Standard
    ports:
      # Host port 14333 (not 1433) to avoid clashing with other local/Docker
      # SQL Server instances on this machine. Container-to-container traffic
      # (api -> mssql) is unaffected since it uses the internal network on 1433.
      - "14333:1433"
    volumes:
      # Mount migration scripts
      - ./database/migrations:/scripts/migrations
      - ./database/seeds:/scripts/seeds
      # Persist database data
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then C=/opt/mssql-tools18/bin/sqlcmd; ARGS='-C'; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then C=/opt/mssql-tools/bin/sqlcmd; ARGS=''; else C=sqlcmd; ARGS='-C'; fi; $$C -S localhost -U sa -P Reset@789 $$ARGS -b -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - ecommerce-network
    command: >
      bash -c '
      /opt/mssql/bin/sqlservr &
      PID=$$!
      SQLCMD=$$(command -v sqlcmd 2>/dev/null || true);
      [ -z "$$SQLCMD" ] && [ -x /opt/mssql-tools18/bin/sqlcmd ] && SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
      [ -z "$$SQLCMD" ] && SQLCMD=/opt/mssql-tools/bin/sqlcmd;
      for i in $$(seq 1 60); do $$SQLCMD -S localhost -U sa -P Reset@789 -C -b -Q "SELECT 1" >/dev/null 2>&1 && break; sleep 2; done;
      ATTEMPT=1;
      until $$SQLCMD -S localhost -U sa -P Reset@789 -C -b -i /scripts/migrations/001_InitialSchema.sql && $$SQLCMD -S localhost -U sa -P Reset@789 -C -b -i /scripts/seeds/001_SeedInitialData.sql; do
      ATTEMPT=$$((ATTEMPT+1));
      if [ $$ATTEMPT -gt 5 ]; then echo "Migration/seed failed after 5 attempts, giving up."; break; fi;
      echo "Migration/seed attempt failed (likely still recovering an existing database) - retrying in 10s (attempt $$ATTEMPT/5)...";
      sleep 10;
      done;
      wait $$PID'

  # ============================================
  # Backend API (.NET Core 10)
  # ============================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # HTTP only in this dev compose file - no cert is configured for Kestrel,
      # so setting ASPNETCORE_HTTPS_PORTS here would make UseHttpsRedirection()
      # redirect to a port nothing is actually listening on. TLS is nginx's job
      # (see docker/nginx.conf's commented HTTPS server block) or, in
      # production, terminated at the load balancer/reverse proxy.
      ASPNETCORE_HTTP_PORTS: 5000
      # Encrypt=false;TrustServerCertificate=true - mssql's cert is a
      # self-signed one generated at container startup; without this,
      # Microsoft.Data.SqlClient's default strict TLS validation rejects it
      # (chain untrusted + hostname mismatch against "mssql"), and every DB
      # call 500s.
      ConnectionStrings__DefaultConnection: "Server=mssql;Database=ECommerceDB;User Id=sa;Password=Reset@789;Encrypt=false;TrustServerCertificate=true;"
      JWT__Secret: "your-super-secret-jwt-key-change-in-production-at-least-32-characters"
      JWT__Issuer: "http://localhost:5000"
      JWT__Audience: "ecommerce-app"
      JWT__ExpiryMinutes: 60
      OpenAI__ApiKey: ${OPENAI_API_KEY:-your-openai-api-key}
      OpenAI__Model: "gpt-4"
      CorsOrigins: "http://localhost:5173,http://localhost:3000,http://localhost:8081"
      App__FrontendBaseUrl: "http://localhost:5173"
      Razorpay__KeyId: ${RAZORPAY_KEY_ID:-your_razorpay_key_id}
      Razorpay__KeySecret: ${RAZORPAY_KEY_SECRET:-your_razorpay_key_secret}
      PayPal__BaseUrl: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      PayPal__ClientId: ${PAYPAL_CLIENT_ID:-your_paypal_client_id}
      PayPal__ClientSecret: ${PAYPAL_CLIENT_SECRET:-your_paypal_client_secret}
    ports:
      - "5000:5000"
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Anonymous volumes so each project's build output stays inside the
      # container instead of sharing bin/obj with host-side builds (Windows
      # paths in a bind-mounted obj/ confuse dotnet watch in the Linux
      # container - same reasoning as frontend's node_modules volume).
      - /app/ECommerce.API/bin
      - /app/ECommerce.API/obj
      - /app/ECommerce.Application/bin
      - /app/ECommerce.Application/obj
      - /app/ECommerce.Domain/bin
      - /app/ECommerce.Domain/obj
      - /app/ECommerce.Infrastructure/bin
      - /app/ECommerce.Infrastructure/obj
      - /app/ECommerce.Persistence/bin
      - /app/ECommerce.Persistence/obj
    networks:
      - ecommerce-network

  # ============================================
  # Frontend (Vue.js)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_APP_NAME: ECommerce Store
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ecommerce-network

  # ============================================
  # NGINX Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: ecommerce-nginx
    ports:
      # Host 8081 (not 80) - port 80 is commonly already taken by something
      # else on a dev machine (it was on the one this was built on). 443 isn't
      # mapped since nginx.conf's HTTPS server block is commented out until
      # there's a real certificate (see docker-compose.prod.yml for that).
      - "8081:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount SSL certificates (create them first)
      # - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - ecommerce-network

  # ============================================
  # Redis (Optional - for caching/sessions)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network

  # ============================================
  # Elasticsearch (Optional - for full-text search)
  # ============================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.5.0
    container_name: ecommerce-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mssql_data:
  redis_data:
  elasticsearch_data:
