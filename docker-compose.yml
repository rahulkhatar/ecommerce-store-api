version: '3.9'

services:
  # ============================================
  # MSSQL Server Database
  # ============================================
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce-mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: Reset@789
      MSSQL_PID: Standard
    ports:
      - "1433:1433"
    volumes:
      # Mount migration scripts
      - ./database/migrations:/scripts/migrations
      - ./database/seeds:/scripts/seeds
      # Persist database data
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "(command -v sqlcmd || echo /opt/mssql-tools18/bin/sqlcmd) -S localhost -U sa -P Reset@789 -C -Q 'SELECT 1' || (/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Reset@789 -Q 'SELECT 1')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - ecommerce-network
    command: >
      bash -c '
      /opt/mssql/bin/sqlservr &
      PID=$$!
      SQLCMD=$$(command -v sqlcmd 2>/dev/null || true);
      [ -z "$$SQLCMD" ] && [ -x /opt/mssql-tools18/bin/sqlcmd ] && SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
      [ -z "$$SQLCMD" ] && SQLCMD=/opt/mssql-tools/bin/sqlcmd;
      for i in $$(seq 1 30); do $$SQLCMD -S localhost -U sa -P Reset@789 -C -Q "SELECT 1" >/dev/null 2>&1 && break; sleep 2; done &&
      $$SQLCMD -S localhost -U sa -P Reset@789 -C -i /scripts/migrations/001_InitialSchema.sql &&
      $$SQLCMD -S localhost -U sa -P Reset@789 -C -i /scripts/seeds/001_SeedInitialData.sql;
      wait $$PID'

  # ============================================
  # Backend API (.NET Core 10)
  # ============================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 5000
      ASPNETCORE_HTTPS_PORTS: 5001
      ConnectionStrings__DefaultConnection: "Server=mssql;Database=ECommerceDB;User Id=sa;Password=Reset@789;"
      JWT__Secret: "your-super-secret-jwt-key-change-in-production-at-least-32-characters"
      JWT__Issuer: "http://localhost:5000"
      JWT__Audience: "ecommerce-app"
      JWT__ExpiryMinutes: 60
      OpenAI__ApiKey: ${OPENAI_API_KEY:-your-openai-api-key}
      OpenAI__Model: "gpt-4"
      CorsOrigins: "http://localhost:5173,http://localhost:3000"
    ports:
      - "5000:5000"
      - "5001:5001"
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - ecommerce-network

  # ============================================
  # Frontend (Vue.js)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_APP_NAME: ECommerce Store
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ecommerce-network

  # ============================================
  # NGINX Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: ecommerce-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount SSL certificates (create them first)
      # - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - ecommerce-network

  # ============================================
  # Redis (Optional - for caching/sessions)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network

  # ============================================
  # Elasticsearch (Optional - for full-text search)
  # ============================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.5.0
    container_name: ecommerce-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mssql_data:
  redis_data:
  elasticsearch_data:
